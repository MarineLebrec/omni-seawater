- join_from_view: main__temp_clean
  join_to_view: main__sal_clean
  join_type: always_left
  on_sql: ${main__temp_clean.time[date]} = ${main__sal_clean.time[date]}
  reversible: false

- join_from_view: main__temp_daily
  join_to_view: main__sal_daily
  join_type: always_left
  on_sql: ${main__temp_daily.date[date]} = ${main__sal_daily.date[date]}
  relationship_type: one_to_one
